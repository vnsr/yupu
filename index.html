<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yupu baby">
<meta name="theme-color" content="#F3F5F9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<title>Yupu baby</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="who"><h1 id="hdrName">Yupu baby</h1><p id="hdrSub"></p></div>
  <button class="icon-btn" id="nightBtn" data-act="night" aria-label="Night light"></button>
  <button class="icon-btn" id="gearBtn" data-act="settings" aria-label="Settings"></button>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<div class="sheet-wrap" id="sheetWrap" data-act="close-bg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="upd" id="upd" role="status"><span>A new version of Yupu baby is ready.</span><button type="button" data-act="reload">Reload</button></div>
<div id="print"></div>
<input type="file" id="importFile" accept=".json,application/json,.csv,text/csv" multiple hidden>
<script src="js/who.js"></script>
<script src="js/i18n-de.js"></script>
<script src="js/app.js"></script>
</body>
</html>
